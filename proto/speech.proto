syntax = "proto3";

package speech;

service SpeechStream {
  rpc Recognize(stream AudioChunk) returns (stream RecognitionResult);
}

message AudioChunk {
  string session_id     = 1;
  string stream_id      = 2;
  bytes  pcm            = 3;
  int32  sample_rate    = 4;
  int32  channels       = 5;
  uint32 rtp_timestamp  = 6;
  int64  duration_ms    = 7;
  bool   end_of_stream  = 8;
  string language       = 9; // transcribe: source language (empty = auto). translate: TARGET language (vi|en); the source is detected
  string task           = 10; // transcribe | translate | keyword
  uint32 rtp_clock_rate = 11; // RTP clock Hz (e.g. 8000 for G.711, 0 = infer from sample_rate)
  int64  chunk_seq      = 12; // monotonic transport sequence number (0-based); -1 = not provided
  string language_source = 13; // SOURCE language hint (vi|en); empty = not provided. Used only when asr.use_language_source is on; it overrides `language` for transcribe and fixes the ASR source for translate (empty = auto)
}

// Topic detected on the ASR-final text of a keyword utterance (task = keyword).
// Numerically aligned with nemotron_testbed.domain.TopicLabel.
enum TopicLabel {
  TOPIC_UNKNOWN = 0; // no topic above keyword.threshold, or not a keyword result
  TOPIC_WEATHER = 1;
  TOPIC_FOOD    = 2;
}

message RecognitionResult {
  string session_id     = 1;
  string stream_id      = 2;
  string text           = 3;
  bool   is_final       = 4;
  int64  ts_start       = 5;
  int64  ts_end         = 6;
  float  confidence     = 7;
  string language       = 8;
  uint64 seq            = 9;
  bytes  audio_payload  = 10; // G.711 payload bytes; gateway packetizes RTP
  uint32 audio_pt       = 11; // 0=PCMU, 8=PCMA
  TopicLabel topic_label = 12; // task=keyword, FINAL only: detected topic (TOPIC_UNKNOWN otherwise)
  float  topic_score    = 13; // task=keyword, FINAL only: cosine similarity of the best topic (0 otherwise)
  string topic_info     = 14; // task=keyword, FINAL only: sub-topic key of the best match ("" otherwise)
}

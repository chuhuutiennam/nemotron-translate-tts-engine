apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron-engine-config
  namespace: ims
data:
  # glibc memory allocator / Python scientific thread controls
  MALLOC_ARENA_MAX: "2"
  MKL_NUM_THREADS: "8"
  NUMEXPR_NUM_THREADS: "8"
  OMP_NUM_THREADS: "8"
  OPENBLAS_NUM_THREADS: "8"
  TOKENIZERS_PARALLELISM: "false"

  # ── GPU layout (4x A30 24 GB) ──────────────────────────────────────
  #
  #   GPU 0, 1  →  ASR  (Nemotron / PyTorch)        — 2 workers/GPU  ~2.4 GB
  #   GPU 2, 3  →  Translation (CTranslate2)        — 2 workers/GPU  ~0.8 GB
  #               + TTS  (Magpie NeMo multilingual) — 1 worker/GPU   ~0.7 GB
  #                                                    total          ~1.5 GB / 24 GB
  #
  # Workload-level isolation: PyTorch (ASR) và CTranslate2 (Translation)
  # không dùng chung GPU. TTS co-locate với Translation trên GPU 2–3.
  # CUDA_MEMORY_FRACTION chỉ áp dụng cho PyTorch trên GPU 0–1.
  # Yêu cầu: torch+cu124, nemo_toolkit trong container image.

  # ── Startup timeout ────────────────────────────────────────────────
  # 4 ASR + 4 Translation + 2 TTS (Magpie) workers load đồng thời; 30 phút đủ dư.
  MODEL_LOADING_TIMEOUT_S: "1800"

  # ── Nemotron ASR  (GPU 0, 1) ───────────────────────────────────────
  MODEL_PATH: /app/models/nemotron-3.5-asr-streaming-0.6b/nemotron-3.5-asr-streaming-0.6b.nemo
  ASR_WORKERS: "4"                   # 2 workers / GPU  (worker 0,2 → cuda:0 ; 1,3 → cuda:1)
  ASR_DEVICE: "cuda:0"               # fallback khi ASR_DEVICES không set
  ASR_DEVICES: "cuda:0,cuda:1"       # ASR độc quyền GPU 0–1
  ASR_LANGUAGE: vi-VN
  ASR_USE_LANGUAGE_SOURCE: "true"    # dùng AudioChunk.language_source (nếu rtpgw gửi) làm ngôn ngữ nguồn; rỗng -> auto
  ASR_BEAM_SIZE: "1"                 # beam search không tương thích với NeMo streaming conformer_stream_step
  MODEL_LEFT_CONTEXT: "56"
  MODEL_LOOKAHEAD_TOKENS: "6"        # 560ms chunk
  WARMUP_SECONDS: "3.0"
  RUNTIME_QUEUE_SIZE: "512"

  # CPU (PyTorch preprocessing / BLAS thread pools)
  CPU_THREADS: "8"
  CPU_INTEROP_THREADS: "2"

  # GPU memory cap — PyTorch trên GPU 0–1 dùng tối đa 90% VRAM (~21.6 GB)
  CUDA_MEMORY_FRACTION: "0.90"

  # ── gRPC / metrics ─────────────────────────────────────────────────
  GRPC_SERVER_ADDRESS: "0.0.0.0:50052"
  METRICS_PORT: "8001"
  MAX_RPC_MESSAGE_MB: "8"
  RESPONSE_QUEUE_SIZE: "256"
  RESULT_QUEUE_MAXSIZE: "1024"
  GRPC_KEEPALIVE_TIME_MS: "60000"
  GRPC_KEEPALIVE_TIMEOUT_MS: "20000"
  GRPC_KEEPALIVE_PERMIT_WITHOUT_CALLS: "true"
  GRPC_MIN_PING_INTERVAL_WITHOUT_DATA_MS: "60000"
  GRPC_MAX_PING_STRIKES: "2"
  GRPC_STOP_GRACE_S: "5.0"
  SHUTDOWN_TIMEOUT_S: "30.0"
  STATS_LOG_INTERVAL_S: "10"
  GPU_MONITOR_INTERVAL_S: "5"

  # ── Logging ────────────────────────────────────────────────────────
  LOG_LEVEL: INFO
  CONSOLE_LOG_LEVEL: ERROR
  THIRD_PARTY_LOG_LEVEL: ERROR
  LOG_FILE: /app/logs/nemotron-engine.log
  LOG_BACKUP_COUNT: "10"
  SUPPRESS_MODEL_INIT_OUTPUT: "true"
  # trace_pcap (docs/trace-pcap-design.md): pcap of the audio received and after AudX; off, needs a restart
  TRACE_PCAP_ENABLED: "false"
  TRACE_PCAP_DIR: /app/logs/pcap
  TRACE_PCAP_MAX_STREAMS: "0"
  TRACE_PCAP_MAX_SECONDS: "0"
  TRACE_PCAP_MIN_FREE_MB: "5120"

  # ── VAD / endpointing ──────────────────────────────────────────────
  VAD_ENABLED: "true"
  VAD_BACKEND: silero
  VAD_THRESHOLD: "0.5"
  # VAD_NEG_THRESHOLD unset → max(VAD_THRESHOLD - 0.15, 0.01) (hysteresis như Silero VADIterator; = VAD_THRESHOLD để tắt)
  VAD_DEVICE: cpu
  VAD_MIN_SPEECH_MS: "250"
  VAD_END_SILENCE_MS: "400"
  VAD_PRE_ROLL_MS: "150"
  VAD_NO_START_WARN_MS: "5000"       # cảnh báo khi stream nhận ngần này audio mà VAD chưa START; 0 = tắt
  MAX_UTTERANCE_MS: "20000"

  # ── Sentence segmentation ──────────────────────────────────────────
  SEGMENTATION_MODE: "on"            # off | shadow | on (shadow chỉ ghi log; on = dịch + TTS + phát từng câu, chỉ bật sau khi có số liệu shadow)
  SEGMENTATION_STABLE_N: "2"
  SEGMENTATION_STABLE_MS: "0"        # 0 = tắt
  SEGMENTATION_PUNCT_STABLE_N: "1"  # dấu mạnh . ? !: số bước model câu phải giữ nguyên (bỏ key = dùng STABLE_N); STABLE_N/MS chỉ còn áp cho cắt tại dấu phẩy
  SEGMENTATION_PUNCT_STABLE_MS: "0"  # dấu mạnh . ? !: hoặc giữ nguyên >= ngần này ms; 0 = tắt (bỏ key = dùng STABLE_MS)
  SEGMENTATION_MIN_TOKENS: "6"
  SEGMENTATION_MAX_SEGMENT_MS: "8000"  # 0 = tắt
  SEGMENTATION_COMMA_AFTER_MS: "0"   # 0 = tắt
  SEGMENTATION_SPEECH_TO_TEXT: "true"  # true = áp dụng segment cho speech_to_text (mode on: is_final theo từng câu; shadow: chỉ log)
  SEGMENTATION_STT_PUNCT_STABLE_N: "2"  # như PUNCT_STABLE_N nhưng riêng cho speech_to_text (bỏ key = dùng PUNCT_STABLE_N)
  SEGMENTATION_STT_PUNCT_STABLE_MS: "0"  # như PUNCT_STABLE_MS nhưng riêng cho speech_to_text; 0 = tắt

  # ── Backpressure / Admission control ───────────────────────────────
  MAX_INGRESS_AUDIO_MS: "120000"
  MAX_POSTPROCESS_PENDING_PER_RPC: "16"  # đếm theo segment khi SEGMENTATION_MODE=on (nên >= 16)
  MAX_CONCURRENT_RPCS: "0"        # 0 = unlimited — tune sau load test
  MAX_CONCURRENT_UTTERANCES: "0"  # 0 = unlimited — tune sau load test
  RPC_MAX_IDLE_S: "300"

  # ── RTP continuity ─────────────────────────────────────────────────
  RTP_GAP_POLICY: insert_silence
  RTP_MAX_GAP_MS: "200"
  RTP_OUT_OF_ORDER_POLICY: drop
  RTP_JITTER_TOLERANCE_MS: "20"

  # ── Audio pre-processing (resemble-enhance, khử nhiễu trước VAD/ASR) ─
  # TẮT = luồng audio như cũ. Bật = thêm độ trễ hằng số D = HOP + RIGHT_CONTEXT + COMPUTE_BUDGET.
  # Trọng số đặt sẵn trong image/volume, không tải lúc chạy (enhance_wavs.py fetch --assets-dir).
  AUDIO_PREPROCESSING_ENABLED: "false"
  AUDIO_PREPROCESSING_MODEL: resemble  # resemble | audx (chỉ chạy một; mỗi model có window riêng, đổi model không phải sửa số nào)
  AUDIO_PREPROCESSING_MODE: denoiser   # resemble.mode: denoiser | enhancer (enhancer D ~4-5 s); AudX chọn bằng MODEL
  AUDIO_PREPROCESSING_SAMPLE_PERCENT: "100"  # % stream bật, chọn ngẫu nhiên mỗi stream
  AUDIO_PREPROCESSING_ASSETS_DIR: /app/models/resemble-enhance
  AUDIO_PREPROCESSING_DEVICES: "cuda:2"  # cùng GPU với Translation/TTS
  AUDIO_PREPROCESSING_WORKERS: "1"
  AUDIO_PREPROCESSING_QUEUE_MAX: "64"  # đầy -> vùng đó dùng audio gốc; chưa đo
  AUDIO_PREPROCESSING_MAX_STREAMS: "0"  # 0 = không giới hạn
  AUDIO_PREPROCESSING_LEFT_CONTEXT_MS: "0"  # resemble.window; 0 = mặc định theo mode (denoiser 1000/500/500/500, enhancer 1000/2000/1000/1500)
  AUDIO_PREPROCESSING_HOP_MS: "0"
  AUDIO_PREPROCESSING_RIGHT_CONTEXT_MS: "0"
  AUDIO_PREPROCESSING_CROSSFADE_MS: "40"
  AUDIO_PREPROCESSING_COMPUTE_BUDGET_MS: "200"  # ~1.5x p99 audio_preproc_window_seconds + chờ hàng đợi; 200 -> D = 1.2 s
  AUDIO_PREPROCESSING_ENHANCER_NFE: "32"
  AUDIO_PREPROCESSING_ENHANCER_LAMBD: "1.0"
  AUDIO_PREPROCESSING_ENHANCER_TAU: "0.5"
  AUDIO_PREPROCESSING_ENHANCER_ALIGN_REGIONS: "true"
  AUDIO_PREPROCESSING_ENHANCER_ALIGN_MAX_MS: "40"
  AUDIO_PREPROCESSING_DITHER_SIGMA_LSB: "3.0"
  AUDIO_PREPROCESSING_DITHER_MIN_ZERO_RUN: "64"
  AUDIO_PREPROCESSING_DITHER_SEED: "0"
  AUDIO_PREPROCESSING_VAD_INPUT: enhanced  # enhanced | raw
  AUDIO_PREPROCESSING_FALLBACK_BAD_REGIONS: "3"
  AUDIO_PREPROCESSING_FALLBACK_BYPASS_S: "10"  # 0 = bypass đến hết stream
  AUDIO_PREPROCESSING_AUDX_CHECKPOINT: /app/models/audx/audx_weights_safe.pth  # chỉ dùng khi MODEL=audx
  AUDIO_PREPROCESSING_AUDX_AGC_TARGET_DBFS: "-28"
  AUDIO_PREPROCESSING_AUDX_AGC_MAX_GAIN_DB: "30"  # 0 = tắt AGC
  AUDIO_PREPROCESSING_AUDX_AGC_CEILING_DBFS: "-16"  # 0 = tắt; > AGC_TARGET_DBFS
  AUDIO_PREPROCESSING_AUDX_CLAMP_TO_INPUT: "true"  # model không làm bin nào to hơn đầu vào
  AUDIO_PREPROCESSING_AUDX_MAX_ATTENUATION_DB: "12"  # 0 = không giới hạn
  AUDIO_PREPROCESSING_AUDX_HOP_MS: "80"  # audx.window (không có left/right); bội số 16 ms
  AUDIO_PREPROCESSING_AUDX_CROSSFADE_MS: "10"  # < AUDX_COMPUTE_BUDGET_MS
  AUDIO_PREPROCESSING_AUDX_COMPUTE_BUDGET_MS: "100"  # D = 80 + 64 + 100 = 244 ms

  # ── Keyword / topic detection (task=keyword) ───────────────────────
  # Bật trên server keyword. Topics (KEYWORD_TOPICS_JSON) bắt buộc khi bật;
  # label = TopicLabel trong proto (WEATHER | FOOD).
  KEYWORD_ENABLED: "false"
  KEYWORD_MODEL_PATH: /app/models/multilingual-e5-small
  KEYWORD_DEVICE: cpu
  KEYWORD_THRESHOLD: "0.75"
  KEYWORD_QUEUE_SIZE: "64"
  # KEYWORD_TOPICS_JSON: '{"WEATHER": {"rain": ["hôm nay trời mưa to quá"]}, "FOOD": {"dish": ["tôi muốn ăn phở"]}}'

  # ── EnViT5 Translation  (GPU 2, 3) ─────────────────────────────────
  TRANSLATION_ENABLED: "true"
  TRANSLATION_MODEL_PATH: /app/models/envit5_ctranslate2
  TRANSLATION_TOKENIZER_PATH: /app/models/envit5_ctranslate2
  TRANSLATION_WORKERS: "4"          # 2 workers / GPU  (worker 0,2 → cuda:2 ; 1,3 → cuda:3)
  TRANSLATION_DEVICE: "cuda:2"      # fallback
  TRANSLATION_DEVICES: "cuda:2,cuda:3"
  TRANSLATION_COMPUTE_TYPE: int8_float16  # Ampere Tensor Core tối ưu
  TRANSLATION_INTER_THREADS: "1"
  TRANSLATION_INTRA_THREADS: "4"
  TRANSLATION_QUEUE_SIZE: "128"
  TRANSLATION_BEAM_SIZE: "4"
  TRANSLATION_MAX_DECODING_LENGTH: "384"
  TRANSLATION_BATCH_SIZE: "16"
  TRANSLATION_BATCH_WAIT_MS: "5"
  TRANSLATION_VI_PREFIX: "vi:"
  TRANSLATION_EN_PREFIX: "en:"
  TRANSLATE_EMIT_SOURCE_PARTIALS: "false"

  # ── TTS  (GPU 2, 3 — co-locate với Translation) ────────────────────
  # TTS_BACKEND=magpie → NeMo MagpieTTS multilingual (1 checkpoint EN + VI)
  # TTS_BACKEND=piper  → Piper/ONNX (model EN + VI riêng, cần TTS_*_MODEL_PATH)
  TTS_ENABLED: "true"
  TTS_BACKEND: "magpie"
  TTS_WORKERS: "2"                   # Magpie: 1 worker / GPU  (worker 0 → cuda:2 ; 1 → cuda:3)
  TTS_DEVICE: "cuda:2"               # fallback
  TTS_DEVICES: "cuda:2,cuda:3"
  TTS_OUTPUT_PT: "0"                 # 0=PCMU | 8=PCMA
  TTS_TARGET_SAMPLE_RATE: "8000"
  TTS_MAX_TEXT_CHARS: "2000"
  TTS_LENGTH_SCALE: "1.0"
  TTS_NOISE_SCALE: "0.667"
  TTS_NOISE_W_SCALE: "0.8"
  TTS_VOLUME: "1.0"
  TTS_INTRA_THREADS: "4"
  TTS_QUEUE_SIZE: "64"

  # ── Magpie TTS backend ─────────────────────────────────────────────
  # 1 NeMo checkpoint multilingual cho cả EN + VI, mỗi worker ~700 MB VRAM.
  # Codec -offline.nemo bao gồm sub-dependencies → không cần internet (air-gapped K8s).
  TTS_MAGPIE_MODEL_PATH: /app/models/magpie_tts/magpie_tts_multilingual_357m.nemo
  TTS_MAGPIE_CODEC_MODEL_PATH: /app/models/magpie_tts/nemo-nano-codec-22khz-1.89kbps-21.5fps/nemo-nano-codec-22khz-1.89kbps-21.5fps-offline.nemo
  TTS_SPEAKER_INDEX: "0"             # 0=Aria 1=Jason 2=John 3=Leo 4=Sofia
  TTS_CFG_SCALE: "2.5"
  TTS_TEMPERATURE: "0.6"
  TTS_TOP_K: "80"
  TTS_MAGPIE_APPLY_TN: "false"       # true = text normalisation trước synthesis (số, viết tắt)

  # ── Piper TTS backend (khi TTS_BACKEND=piper) ─────────────────────
  # Chỉ dùng khi cần switch về Piper. Giữ lại để fallback.
  TTS_EN_MODEL_PATH: /app/models/piper/en_US-lessac-medium.onnx
  TTS_EN_CONFIG_PATH: /app/models/piper/en_US-lessac-medium.onnx.json
  TTS_VI_MODEL_PATH: /app/models/piper/vi_VN-vais1000-medium.onnx
  TTS_VI_CONFIG_PATH: /app/models/piper/vi_VN-vais1000-medium.onnx.json
